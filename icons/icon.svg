<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Shield shape -->
  <path d="M64 8 L112 28 L112 64 Q112 100 64 120 Q16 100 16 64 L16 28 Z" fill="#4A90D9"/>
  <!-- Shield border/highlight -->
  <path d="M64 8 L112 28 L112 64 Q112 100 64 120 Q16 100 16 64 L16 28 Z" fill="none" stroke="#3A7BC8" stroke-width="2"/>

  <!-- Eye shape - outer almond -->
  <path d="M32 64 Q48 44 64 44 Q80 44 96 64 Q80 84 64 84 Q48 84 32 64 Z" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eye - iris circle -->
  <circle cx="64" cy="64" r="10" fill="white"/>

  <!-- Diagonal slash through the eye -->
  <line x1="38" y1="82" x2="90" y2="46" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Second line for depth/contrast on slash -->
  <line x1="38" y1="82" x2="90" y2="46" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>
</svg>
