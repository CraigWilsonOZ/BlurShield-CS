<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>BlurShield</h1>
      <label class="toggle master-toggle">
        <input type="checkbox" id="masterToggle">
        <span class="slider"></span>
      </label>
    </header>

    <div id="content" class="content">
      <section class="site-section">
        <div class="site-row">
          <span id="currentSite" class="site-name">-</span>
          <label class="toggle">
            <input type="checkbox" id="siteToggle">
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="categories-section">
        <h2>Categories</h2>
        <div id="categoryList" class="category-list"></div>
      </section>

      <section class="stats-section">
        <span id="maskedCount">0 items masked</span>
      </section>
    </div>

    <footer>
      <a href="#" id="openOptions">Options</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
